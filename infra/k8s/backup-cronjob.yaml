apiVersion: batch/v1
kind: CronJob
metadata:
  name: mt-backup
  namespace: miniature-train
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          automountServiceAccountToken: false
          containers:
            - name: backup
              image: miniature-train/backup:v0.23.0
              args: ["--rpo-hours=24", "--retain=30"]
              resources:
                requests:
                  cpu: "250m"
                  memory: 256Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
