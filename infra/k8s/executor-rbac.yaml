apiVersion: v1
kind: ServiceAccount
metadata:
  name: executor
  namespace: miniature-train
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor
  namespace: miniature-train
rules:
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, patch]
  - apiGroups: ["argoproj.io"]
    resources: [rollouts]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: executor
  namespace: miniature-train
subjects:
  - kind: ServiceAccount
    name: executor
roleRef:
  kind: Role
  name: executor
  apiGroup: rbac.authorization.k8s.io
