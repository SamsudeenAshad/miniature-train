apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: miniature-train
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: ["--config.file=/etc/prometheus/prometheus.yaml"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1000m"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: rules
          configMap:
            name: prometheus-rules
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: miniature-train
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: miniature-train
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: dashboards
          configMap:
            name: grafana-dashboards
            items:
              - key: operations.json
                path: operations.json
        - name: provisioning
          configMap:
            name: grafana-dashboards
            items:
              - key: provider.yaml
                path: provider.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: miniature-train
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
