apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference
  namespace: miniature-train
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: inference
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: control-api
  namespace: miniature-train
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: control-api
