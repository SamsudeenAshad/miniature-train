apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: miniature-train
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          args: ["-config.file=/etc/tempo/config.yaml"]
          ports:
            - containerPort: 3200
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1000m"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: miniature-train
spec:
  selector:
    app: tempo
  ports:
    - port: 3200
