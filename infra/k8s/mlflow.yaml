apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: miniature-train
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.0
          args: ["server", "--host", "0.0.0.0", "--backend-store-uri", "sqlite:////data/mlflow.db",
                 "--default-artifact-root", "s3://miniature-train/mlflow"]
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1000m"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: miniature-train
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
