apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: prediction-api
  namespace: miniature-train
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference
  strategy:
    canary:
      canaryService: prediction-api-canary
      stableService: prediction-api-stable
      trafficRouting:
        istio:
          virtualService:
            name: prediction-api
            routes: [primary]
      steps:
        - setWeight: 5
        - pause: {duration: 5m}
        - setWeight: 25
        - pause: {duration: 5m}
        - setWeight: 50
        - pause: {duration: 5m}
        - setWeight: 100
        - pause: {duration: 10m}
