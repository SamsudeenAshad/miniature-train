# Local development only (SRS 13.1). Secrets come from the environment, never this file.
services:
  control-api:
    build:
      context: ..
      dockerfile: infra/docker/control-api.Dockerfile
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=mt
      - POSTGRES_USER=mt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  inference:
    build:
      context: ..
      dockerfile: infra/docker/inference.Dockerfile
    ports:
      - "8001:8000"
  db:
    image: postgres:16.4
    environment:
      - POSTGRES_USER=mt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=mt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt -d mt"]
      interval: 5s
      timeout: 3s
      retries: 10
