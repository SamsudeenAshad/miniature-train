# Local development only (SRS 13.1). Secrets come from the environment, never this file.
services:
  control-api:
    build:
      context: ..
      dockerfile: infra/docker/control-api.Dockerfile
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=mt
      - POSTGRES_USER=mt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
  inference:
    build:
      context: ..
      dockerfile: infra/docker/inference.Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./apps/web/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-api:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
  db:
    image: postgres:16.4
    environment:
      - POSTGRES_USER=mt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_DB=mt
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt -d mt"]
      interval: 5s
      timeout: 3s
      retries: 10
