apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: miniature-train
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SamsudeenAshad/miniature-train.git
    targetRevision: main
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: miniature-train
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      -respectIgnoreDifferences=true
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
